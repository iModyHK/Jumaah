# Portainer stack for the Jumaah site.
# Set TURNSTILE_SECRET_KEY and RESEND_API_KEY as stack environment variables in Portainer
# (Stacks → Add stack → Environment variables), never in this file.
services:
  jumaah-site:
    image: malkurbi5/jumaah-site:latest
    container_name: jumaah-site
    restart: unless-stopped
    ports:
      - "8787:8080"
    environment:
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      TO_EMAIL: malkurbi5@gmail.com
      TRUST_PROXY: "1"
