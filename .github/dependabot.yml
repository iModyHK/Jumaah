version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    open-pull-requests-limit: 5
    ignore:
      # zod 4 is a migration across every schema; done on purpose, not by a bot.
      - dependency-name: zod
        update-types: [version-update:semver-major]
      # @vitejs/plugin-react 5+ needs a newer Vite than the apps use; bump together with Vite.
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: weekly }
    ignore:
      # Node: stay on the active LTS line (22); a major bump is a deliberate change.
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /apps/sync-worker
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /infra
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
