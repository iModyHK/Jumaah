# =============================================================================
# Jumaah Cloud — the hosted platform: API + screens for every mosque, the sync server, billing, and the
# marketing site, all behind one Caddy.
#   docker compose --profile site up -d
# Layout: this repository (jumaah-site) with the Community Edition checked out as the "community" submodule.
# =============================================================================
name: jumaah-cloud

x-app-env: &app-env
  NODE_ENV: production
  IMAGE_TAG: ${IMAGE_TAG:-1.2.0}
  DATABASE_URL: postgresql://${POSTGRES_USER:-jumaah}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jumaah}?schema=public
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://${SITE_ADDRESS:-localhost}}
  # Mosques live at <slug>.<TENANT_BASE_DOMAIN>; leave empty for a single-address cloud.
  TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10}
  RATE_LIMIT_GENERAL: ${RATE_LIMIT_GENERAL:-600}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
  DEEPL_API_KEY: ${DEEPL_API_KEY:-}
  BACKUP_DIR: /app/backups
  BACKUP_KEEP: ${BACKUP_KEEP:-50}
  SEED_ON_START: ${SEED_ON_START:-0}
  SEED_SUPER_ADMIN_EMAIL: ${SEED_SUPER_ADMIN_EMAIL:-admin@jumaah.app}
  SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD:?set SEED_SUPER_ADMIN_PASSWORD}
  SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
  # Defaults for the platform settings edited in the portal (what is saved there wins over these).
  SITE_URL: ${SITE_URL:-https://www.jumaah.net}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  BILLING_SELLER_NAME: ${BILLING_SELLER_NAME:-Jumaah Cloud}
  BILLING_SELLER_ADDRESS: ${BILLING_SELLER_ADDRESS:-}
  BILLING_VAT_RATE: ${BILLING_VAT_RATE:-0}
  BILLING_VAT_NUMBER: ${BILLING_VAT_NUMBER:-}
  BILLING_BANK: ${BILLING_BANK:-}
  BILLING_IBAN: ${BILLING_IBAN:-}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual}
  MOYASAR_SECRET_KEY: ${MOYASAR_SECRET_KEY:-}
  MOYASAR_WEBHOOK_SECRET: ${MOYASAR_WEBHOOK_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-0}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Jumaah}
  MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
  MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
  MAIL_NOTIFY: ${MAIL_NOTIFY:-}

services:
  web:
    image: ${REGISTRY:-malkurbi5}/jumaah-cloud-web:${IMAGE_TAG:-1.2.0}
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.cloud"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_UPSTREAM: api:4000
      SITE_UPSTREAM: site:8080
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # The Caddy configuration comes from the checkout, so config changes need only a git pull and a restart.
      - ./infra/caddy:/etc/caddy:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${REGISTRY:-malkurbi5}/jumaah-cloud-api:${IMAGE_TAG:-1.2.0}
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    environment: *app-env
    volumes:
      - backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: ${API_REPLICAS:-1}

  # The marketing site (www.<TENANT_BASE_DOMAIN>), served through the same Caddy:  --profile site
  site:
    image: ${REGISTRY:-malkurbi5}/jumaah-site:${IMAGE_TAG:-1.2.0}
    build:
      context: ./site
      args:
        APP_VERSION: ${IMAGE_TAG:-1.2.0}
    restart: unless-stopped
    profiles: [site]
    environment:
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TO_EMAIL: ${SITE_TO_EMAIL:-}
      TRUST_PROXY: "1"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jumaah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jumaah}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jumaah} -d ${POSTGRES_DB:-jumaah}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Nightly logical dump of the whole platform database (kept 14 days).
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdumps:/dumps
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h db -U ${POSTGRES_USER:-jumaah} ${POSTGRES_DB:-jumaah} | gzip > /dumps/jumaah-$(date +%F-%H%M).sql.gz
          find /dumps -name '*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  backups:
  pgdumps:
  caddy_data:
  caddy_config:
