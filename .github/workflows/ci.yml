name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jumaah
          POSTGRES_PASSWORD: jumaah_dev_password
          POSTGRES_DB: jumaah
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jumaah" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://jumaah:jumaah_dev_password@localhost:5432/jumaah?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci
      ENCRYPTION_KEY: ci-encryption-key-ci-encryption-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm test -- --filter=!@jumaah/e2e
      - name: E2E
        run: |
          pnpm --filter @jumaah/e2e install-browsers
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/imodyhk/jumaah-api:latest
            ghcr.io/imodyhk/jumaah-api:${{ github.sha }}
      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web.Dockerfile
          push: true
          tags: |
            ghcr.io/imodyhk/jumaah-web:latest
            ghcr.io/imodyhk/jumaah-web:${{ github.sha }}
