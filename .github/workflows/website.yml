# Builds the jumaah.net site image, scans it, and pushes it to Docker Hub.
# - Every push to main that touches website/ → build + scan (no push)
# - Every tag v*                             → build + scan + push :latest and :<version>
# Secrets needed on the repo: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub access token with write scope).
name: website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["website/**"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Build static site (sanity check of build.mjs)
        working-directory: website
        run: node build.mjs && test -f dist/index.html && test -f dist/en/index.html && test -f dist/_headers

      - name: App version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: website
          load: true
          tags: malkurbi5/jumaah-site:ci
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            SITE_URL=https://www.jumaah.net

      - name: Smoke test the image
        run: |
          docker run -d --name site -p 8080:8080 -e TURNSTILE_SECRET_KEY=x -e RESEND_API_KEY=x malkurbi5/jumaah-site:ci
          sleep 3
          curl -fsS http://localhost:8080/healthz
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:8080/ | grep -q 200
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:8080/en/demo | grep -q 200
          curl -fsSI http://localhost:8080/ | grep -qi "content-security-policy"
          docker rm -f site

      - name: Scan image for vulnerabilities (fails on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: malkurbi5/jumaah-site:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with: { sarif_file: trivy.sarif }

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: website
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            malkurbi5/jumaah-site:latest
            malkurbi5/jumaah-site:${{ steps.ver.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            SITE_URL=https://www.jumaah.net
